# ABOUTME: CI for cluster-free checks: static contract tests and lint on every PR and push to main.
# ABOUTME: The static-tests job is a required status check under branch protection.
name: static

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.11"
      - name: Static contract tests
        run: uv run --locked --group test pytest tests/static -q
      - name: Component inventory
        run: uv run --locked --group test python scripts/check_components.py
      - name: Lint
        run: |
          uv run --locked --group dev ruff check scripts tests
          uv run --locked --group dev ruff format --check scripts tests
