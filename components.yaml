# ABOUTME: Pinned inventory of every platform component, the single source of versions.
# ABOUTME: Validated by scripts/check_components.py; the builder never uses unpinned versions.
#
# Versions adopted from the book's companion repository (MIT,
# PacktPublishing/Agentic-DevOps-with-Claude-Code at a907044, 2026-09-23),
# with corrections from the book text where the two disagree.
#
# Schema per component:
#   name           kebab-case identifier, unique
#   plane          foundation | ai | self-service
#   profiles       subset of [local, eks]; where the component is deployed
#   project_url    upstream project
#   install_method helm | helm-oci | kustomize | kubectl | library
#   chart_repo     chart repository for helm installs, else null
#   chart_name     chart name for helm installs, else null
#   chart_version  pinned chart version, required for helm installs
#   app_version    pinned application or image version, always required
#   namespace      target namespace, or null for cluster-scoped or libraries
#   phase          framework phase that introduces it
#   notes          maturity and integration facts that affect operation
#   bundled        optional list of {name, version} for umbrella installs

metadata:
  resolved_on: "2026-09-27"
  source: "PacktPublishing/Agentic-DevOps-with-Claude-Code@a907044"
  kubernetes_min_minor: "1.34"
  profiles:
    local: "kind v0.33.0, node v1.35.8 pinned in platform/profiles/local/kind-config.yaml (Apple Silicon host; arm64 images required)"
    eks: "Amazon EKS with EBS CSI, AWS Load Balancer Controller, Pod Identity"

components:

  # --- Foundation: GitOps ---
  - name: argo-cd
    plane: foundation
    profiles: [local, eks]
    project_url: https://argo-cd.readthedocs.io
    install_method: helm
    chart_repo: https://argoproj.github.io/argo-helm
    chart_name: argo-cd
    chart_version: "9.5.22"
    app_version: "v3.4.4"
    namespace: argocd
    phase: 1
    notes: >
      Only direct install (bootstrap). Server-side apply with force-conflicts.
      3.x RBAC no longer cascades update/delete to sub-resources; log access
      needs explicit permission.


  # --- Foundation: certificates, secrets, policy ---
  - name: cert-manager
    plane: foundation
    profiles: [local, eks]
    project_url: https://cert-manager.io
    install_method: helm-oci
    chart_repo: oci://quay.io/jetstack/charts/cert-manager
    chart_name: cert-manager
    chart_version: "v1.20.2"
    app_version: "v1.20.2"
    namespace: cert-manager
    phase: 1
    notes: Sync wave 0. Required before webhook-backed controllers.

  - name: openbao
    plane: foundation
    profiles: [local, eks]
    project_url: https://openbao.org
    install_method: helm
    chart_repo: https://openbao.github.io/openbao-helm
    chart_name: openbao
    chart_version: "0.28.4"
    app_version: "v2.5.5"
    namespace: openbao
    phase: 1
    notes: >
      Linux Foundation, MPL-2.0 Vault fork. Every profile: persistent
      storage, documented unseal (AWS KMS on eks), Kubernetes auth, audit
      device. Dev mode is forbidden.

  - name: external-secrets
    plane: foundation
    profiles: [local, eks]
    project_url: https://external-secrets.io
    install_method: helm
    chart_repo: https://charts.external-secrets.io
    chart_name: external-secrets
    chart_version: "2.6.0"
    app_version: "v2.6.0"
    namespace: external-secrets
    phase: 1
    notes: Use external-secrets.io/v1; v1beta1 is retired.

  - name: kyverno
    plane: foundation
    profiles: [local, eks]
    project_url: https://kyverno.io
    install_method: helm
    chart_repo: https://kyverno.github.io/kyverno
    chart_name: kyverno
    chart_version: "3.8.1"
    app_version: "v1.18.1"
    namespace: kyverno
    phase: 1
    notes: >
      All policies ship in Audit. ClusterPolicy is deprecated and scheduled
      for removal in 1.20; write new rules as ValidatingPolicy.

  # --- Foundation: EKS-only integrations ---
  - name: aws-load-balancer-controller
    plane: foundation
    profiles: [eks]
    project_url: https://kubernetes-sigs.github.io/aws-load-balancer-controller
    install_method: helm
    chart_repo: https://aws.github.io/eks-charts
    chart_name: aws-load-balancer-controller
    chart_version: "3.4.0"
    app_version: "v3.4.0"
    namespace: kube-system
    phase: 1
    notes: >
      Set clusterName and vpcId explicitly (IMDS lookup times out under
      prefix delegation). Authenticate with EKS Pod Identity.

  - name: aws-ebs-csi-driver
    plane: foundation
    profiles: [eks]
    project_url: https://kubernetes-sigs.github.io/aws-ebs-csi-driver
    install_method: helm
    chart_repo: https://kubernetes-sigs.github.io/aws-ebs-csi-driver
    chart_name: aws-ebs-csi-driver
    chart_version: "2.62.0"
    app_version: "v1.62.0"
    namespace: kube-system
    phase: 1
    notes: Backs the single default encrypted gp3 StorageClass.

  # --- Foundation: observability ---
  - name: kube-prometheus-stack
    plane: foundation
    profiles: [local, eks]
    project_url: https://github.com/prometheus-community/helm-charts
    install_method: helm
    chart_repo: https://prometheus-community.github.io/helm-charts
    chart_name: kube-prometheus-stack
    chart_version: "86.3.2"
    app_version: "operator v0.91.0"
    namespace: observability
    phase: 2
    notes: >
      EKS profile disables scheduler, controller-manager, and etcd scrapes.
      Grafana needs explicit Loki and Tempo data sources.
    bundled:
      - name: prometheus
        version: "v3.12.0"
      - name: grafana
        version: "13.0.2"
      - name: alertmanager
        version: "v0.33.0"
      - name: kube-state-metrics
        version: "7.5.1"
      - name: prometheus-node-exporter
        version: "4.55.0"

  - name: loki
    plane: foundation
    profiles: [local, eks]
    project_url: https://grafana.com/oss/loki
    install_method: helm
    chart_repo: https://grafana-community.github.io/helm-charts
    chart_name: loki
    chart_version: "17.4.7"
    app_version: "3.7.2"
    namespace: observability
    phase: 2
    notes: Object storage backend in every profile. Keep request, session, and trace IDs out of labels.

  - name: tempo
    plane: foundation
    profiles: [local, eks]
    project_url: https://grafana.com/oss/tempo
    install_method: helm
    chart_repo: https://grafana-community.github.io/helm-charts
    chart_name: tempo
    chart_version: "1.25.0"
    app_version: "2.9.0"
    namespace: observability
    phase: 2
    notes: >
      Pinned below 2.10: standalone search returned no flushed blocks and the
      trace round-trip failed. Lift only after the round-trip test passes on
      a newer release; the upstream issue closure is not evidence.

  - name: opentelemetry-collector
    plane: foundation
    profiles: [local, eks]
    project_url: https://opentelemetry.io
    install_method: helm
    chart_repo: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart_name: opentelemetry-collector
    chart_version: "0.158.2"
    app_version: "0.153.0"
    namespace: observability
    phase: 2
    notes: >
      Daemonset with service.enabled true and explicit image repository.
      kubernetesAttributes preset prepends k8sattributes; render and read the
      final pipeline. Do not use the eks resource detector.

  - name: opentelemetry-operator
    plane: foundation
    profiles: [local, eks]
    project_url: https://opentelemetry.io
    install_method: helm
    chart_repo: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart_name: opentelemetry-operator
    chart_version: "0.115.0"
    app_version: "0.153.0"
    namespace: observability
    phase: 2
    notes: Webhook certificate from cert-manager.

  # --- Foundation: portal and delivery extensions ---
  - name: backstage
    plane: foundation
    profiles: [local, eks]
    project_url: https://backstage.io
    install_method: helm
    chart_repo: https://backstage.github.io/charts
    chart_name: backstage
    chart_version: "2.8.2"
    app_version: "1.51.2"
    namespace: backstage
    phase: 3
    notes: >
      Requires a custom image we build and own (plugins and config). Pass
      --config app-config.production.yaml explicitly. Build TechDocs
      externally in CI.
    bundled:
      - name: backstage-techdocs
        version: "1.51.2"
      - name: backstage-software-catalog
        version: "1.51.2"
      - name: backstage-scaffolder
        version: "1.51.2"
      - name: backstage-argocd-plugin
        version: "2.12.5"

  - name: argo-workflows
    plane: foundation
    profiles: [local, eks]
    project_url: https://argo-workflows.readthedocs.io
    install_method: helm
    chart_repo: https://argoproj.github.io/argo-helm
    chart_name: argo-workflows
    chart_version: "1.0.16"
    app_version: "v4.0.6"
    namespace: argo
    phase: 3
    notes: Large CRDs; server-side apply.

  - name: argo-events
    plane: foundation
    profiles: [local, eks]
    project_url: https://argoproj.github.io/argo-events
    install_method: helm
    chart_repo: https://argoproj.github.io/argo-helm
    chart_name: argo-events
    chart_version: "2.4.22"
    app_version: "v1.9.10"
    namespace: argo-events
    phase: 3
    notes: Sensors need an explicit JetStream EventBus.

  - name: argo-rollouts
    plane: foundation
    profiles: [local, eks]
    project_url: https://argo-rollouts.readthedocs.io
    install_method: helm
    chart_repo: https://argoproj.github.io/argo-helm
    chart_name: argo-rollouts
    chart_version: "2.41.0"
    app_version: "v1.9.0"
    namespace: argo-rollouts
    phase: 3
    notes: Gateway API traffic routing needs the separate argoproj-labs plugin.

  - name: keda
    plane: foundation
    profiles: [local, eks]
    project_url: https://keda.sh
    install_method: helm
    chart_repo: https://kedacore.github.io/charts
    chart_name: keda
    chart_version: "2.20.1"
    app_version: "2.20.1"
    namespace: keda
    phase: 3
    notes: Scales pods, not nodes.

  # --- AI plane: traffic ---
  - name: gateway-api
    plane: ai
    profiles: [local, eks]
    project_url: https://gateway-api.sigs.k8s.io
    install_method: kubectl
    chart_repo: null
    chart_name: null
    chart_version: null
    app_version: "v1.5.1"
    namespace: null
    phase: 4
    notes: Vendored standard-channel CRDs. Client cert validation lives at spec.tls.frontend.

  - name: kgateway
    plane: ai
    profiles: [local, eks]
    project_url: https://kgateway.dev
    install_method: helm-oci
    chart_repo: oci://cr.kgateway.dev/kgateway-dev/charts
    chart_name: kgateway
    chart_version: "v2.3.4"
    app_version: "v2.3.4"
    namespace: kgateway-system
    phase: 4
    notes: Install kgateway-crds first. General ingress; sibling of agentgateway.

  - name: agentgateway
    plane: ai
    profiles: [local, eks]
    project_url: https://agentgateway.dev
    install_method: helm-oci
    chart_repo: oci://cr.agentgateway.dev/charts
    chart_name: agentgateway
    chart_version: "v1.3.0"
    app_version: "v1.3.0"
    namespace: agentgateway
    phase: 4
    notes: >
      Linux Foundation, not CNCF. Chart has no mtls or audit keys; configure
      on Gateway and AgentgatewayPolicy. Always creates a LoadBalancer
      Service; on EKS annotate it internal via spec.infrastructure.

  # --- AI plane: model serving ---
  - name: kserve
    plane: ai
    profiles: [local, eks]
    project_url: https://kserve.github.io/website
    install_method: helm-oci
    chart_repo: oci://ghcr.io/kserve/charts
    chart_name: kserve-resources
    chart_version: "v0.19.0"
    app_version: "v0.19.0"
    namespace: kserve
    phase: 5
    notes: >
      Install kserve-crd first. RawDeployment is normalized to Standard (ignore
      that one annotation). Internal-only topology reports Ready=False;
      health keys on PredictorReady.

  - name: vllm
    plane: ai
    profiles: [local, eks]
    project_url: https://docs.vllm.ai
    install_method: kubectl
    chart_repo: null
    chart_name: null
    chart_version: null
    app_version: "v0.23.0"
    namespace: kserve
    phase: 5
    notes: >
      Upstream CPU image is x86_64 only; we build a multi-arch (arm64, amd64)
      image with baked weights, signed and pinned by digest. Book-corrected
      x86 settings: no --device flag,
      VLLM_CPU_KVCACHE_SPACE=2, 16Gi limit, 4Gi memory /dev/shm, SYS_NICE
      only, runAsUser 1001 with HOME=/tmp and USER=vllm, hermes tool parser,
      served-model-name qwen3-1.7b.

  # --- AI plane: agents, tools, telemetry ---
  - name: kagent
    plane: ai
    profiles: [local, eks]
    project_url: https://kagent.dev
    install_method: helm-oci
    chart_repo: oci://ghcr.io/kagent-dev/kagent/helm
    chart_name: kagent
    chart_version: "0.9.9"
    app_version: "v0.9.9"
    namespace: kagent
    phase: 6
    notes: >
      Install kagent-crds first. Agent API kagent.dev/v1alpha2. Per-agent
      Service listens on 8080 and speaks A2A JSON-RPC. Agent tracing is off
      by default in the chart.

  - name: mcp-everything-server
    plane: ai
    profiles: [local, eks]
    project_url: https://modelcontextprotocol.io
    install_method: kubectl
    chart_repo: null
    chart_name: null
    chart_version: null
    app_version: "everything-2025-11-25"
    namespace: kagent
    phase: 6
    notes: Protocol validation only; replace with purpose-built read-only tools.

  - name: openllmetry
    plane: ai
    profiles: [local, eks]
    project_url: https://github.com/traceloop/openllmetry
    install_method: library
    chart_repo: null
    chart_name: null
    chart_version: null
    app_version: "traceloop-sdk 0.61.0"
    namespace: null
    phase: 6
    notes: Pinned together with openai 1.109.1. GenAI attributes are Development grade.
